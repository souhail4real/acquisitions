apiVersion: apps/v1
kind: Deployment
metadata:
  name: acquisitions-api
  namespace: acquisitions
  labels:
    app: acquisitions
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: acquisitions
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: acquisitions
        component: api
    spec:
      containers:
        - name: acquisitions-api
          image: souhail4real/acquisitions:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: acquisitions-config
          # Sensitive environment variables from Secret
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: acquisitions-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: acquisitions-secrets
                  key: JWT_SECRET
          # Liveness probe - restarts container if unhealthy
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness probe - removes from service if not ready
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Resource limits and requests
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '500m'
      # Graceful shutdown
      terminationGracePeriodSeconds: 30
