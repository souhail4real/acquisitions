# Docker Compose for Development with Neon Local
# This setup uses Neon Local proxy to create ephemeral database branches

services:
  # Neon Local - Creates ephemeral branches for development/testing
  neon-local:
    image: neondatabase/neon_local:latest
    container_name: neon-local-dev
    ports:
      - '5432:5432'
    env_file:
      - .env.development

    volumes:
      # Persist branch metadata per Git branch
      - ./.neon_local/:/tmp/.neon_local
      - ./.git/HEAD:/tmp/.git/HEAD:ro
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '5432']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - acquisitions-network

  # Application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acquisitions-app-dev
    ports:
      - '3000:3000'
    env_file:
      - .env.development
    depends_on:
      - neon-local
    volumes:
      # Mount source code for hot reloading in development
      - ./src:/app/src:ro
      - ./package.json:/app/package.json:ro
    networks:
      - acquisitions-network
    restart: unless-stopped

networks:
  acquisitions-network:
    driver: bridge
