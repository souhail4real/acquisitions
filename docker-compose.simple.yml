# Simplified Docker Compose for Development (Direct Neon Cloud Connection)
# This bypasses Neon Local and connects directly to your Neon Cloud database

services:
  # Application service only
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acquisitions-app-dev
    ports:
      - '3000:3000'
    env_file:
      - .env.development
    volumes:
      # Mount source code for hot reloading in development
      - ./src:/app/src:ro
      - ./package.json:/app/package.json:ro
    restart: unless-stopped
